repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.7
          - types-requests
          - types-beautifulsoup4
        args: [--config-file=pyproject.toml]
        files: ^src/

  - repo: local
    hooks:
      - id: pytest-quick
        name: pytest-quick (failed-first, stop-on-fail)
        entry: pytest -x --ff -q
        language: system
        pass_filenames: false
        stages: [pre-push]
