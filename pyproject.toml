[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "index-rebalance-tracker"
version = "0.1.0"
description = "Event-study, liquidity, and TCA analytics for S&P 500 and MSCI Singapore Free index rebalances. Free data only, fully reproducible."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "QuantMaverick" }]
keywords = ["index-rebalancing", "event-study", "quant", "finance", "tca"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "yfinance>=0.2.40",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "polars>=1.0",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "pandas-stubs",
    "types-requests",
    "types-beautifulsoup4",
]

[project.scripts]
index-rebalance = "index_rebalance_tracker.cli:app"

[project.urls]
Homepage = "https://github.com/QuantMaverick/index-rebalance-tracker"
Issues = "https://github.com/QuantMaverick/index-rebalance-tracker/issues"

# ── Ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "PT",  # flake8-pytest-style
    "ARG", # unused-arguments
]
ignore = [
    "E501",  # line-too-long handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "N802"]  # test fixture args, snake_case in test names
"notebooks/**" = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["yfinance.*", "bs4.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=index_rebalance_tracker",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "-ra",
    "--strict-markers",
]
markers = [
    "network: tests that hit live network (skipped by default in CI)",
]

[tool.coverage.run]
branch = true
source = ["src/index_rebalance_tracker"]
omit = ["*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
